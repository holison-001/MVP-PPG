<text x="421.52" y="615.3000000000001" class="small" text-anchor="middle">VTref</text>
<text x="325" y="116" class="small" text-anchor="middle">Ø13.5 mm</text>
<text x="325" y="673" class="subtitle" text-anchor="middle">회색: 기존 배선·비아 / 색상: 제안 패드</text>
<text x="325" y="698" class="small" text-anchor="middle">기존 GND 푸어는 생략 표시 · J2 케이블 GND는 바텀 유지</text>
<rect x="622" y="119" width="502" height="314" rx="14" fill="white" stroke="#dce4ec"/>
<text x="648" y="154" class="title" >프로그래밍 접점: 5패드 권장</text>
<text x="648" y="190" class="body" >NRST · SWDIO · GND · SWCLK · 3V3(VTref)</text>
<text x="648" y="225" class="body" >패드 지름 0.8 mm / 중심 간격 1.27 mm</text>
<text x="648" y="257" class="body" >패드 간 구리 간격 0.47 mm</text>
<text x="648" y="289" class="body" >보드 외곽까지 최소 0.875 mm</text>
<text x="648" y="321" class="body" >U1 영역과 수직 간격 1.975 mm</text>
<text x="648" y="353" class="body" >기존 다른 신호 구리와 최소 0.249 mm</text>
<text x="648" y="396" class="small" >F.Cu + F.Mask / F.Paste 제외 / 포고핀 지그용</text>
<rect x="622" y="451" width="502" height="247" rx="14" fill="#fffaf0" stroke="#eadab8"/>
<text x="648" y="488" class="body" font-weight="700">D6 · D7 전원 보호로 변경할 경우</text>
<text x="648" y="524" class="body" >D6: 3V3 ↔ GND / ESD351 유지 가능</text>
<text x="648" y="556" class="body" >D7: 5V_LED ↔ GND / ESD441DPYR 교체 후보</text>
<text x="648" y="592" class="small" style="fill:#ae3e27">현재 D7(ESD351, 3.6V)은 5V에 사용 불가</text>
